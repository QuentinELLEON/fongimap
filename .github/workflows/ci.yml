name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python scripts compile
        run: python -m compileall -q tools
      - name: Build the browser assets (index.html + assets/)
        run: python tools/build_web.py --out "$RUNNER_TEMP/dist" && find "$RUNNER_TEMP/dist" -type f | sort
      - name: The committed assets are up to date with src/
        run: |
          python tools/build_web.py --out "$RUNNER_TEMP/fresh" > /dev/null
          for f in css/app.css js/app.js js/core.js js/worker-source.js js/geo-france.js; do
            diff -q "$RUNNER_TEMP/fresh/assets/$f" "assets/$f" || { echo "assets/$f is stale: run python tools/build_web.py and commit"; exit 1; }
          done
      - name: Node tests (core engine golden master, search, geometry decoding)
        run: node --test "tests/*.test.js"
