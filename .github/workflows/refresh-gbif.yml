# Rebuilds the "GBIF - champignons de France depuis 2022" dataset from the GBIF API and uploads the files as an
# artifact. UNTESTED on GitHub (written and checked locally only). Manual trigger on purpose: a scheduled run
# (e.g. weekly) is a one-line change (`schedule: - cron: "0 5 * * 1"`) once the owner has decided where to publish
# (GitHub Pages / release asset) and how to cite (GBIF download DOI, see specs/datasets.md).
name: refresh-gbif-dataset
on:
  workflow_dispatch:
    inputs:
      allow_nc:
        description: "Also accept CC-BY-NC records (NOT redistributable commercially)"
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - name: Fetch raw inputs (checksum-verified)
        run: python tools/fetch_raw.py --what all
      - name: Import GBIF occurrences (France, macrofungi, 2022 -> today)
        run: python tools/import_gbif.py --from-year 2022 --out test_data/gbif_fr.csv ${{ inputs.allow_nc && '--allow-nc' || '' }}
      - name: Build the dataset (chunked by period)
        run: >
          python build.py --csv test_data/gbif_fr.csv --dataset-id gbif_fr_recent --chunks 3 --year-min 2022 --year-max "$(date -u +%Y)"
          --title "GBIF - champignons de France depuis 2022" --credit "GBIF.org, occurrences Fungi France (macromycetes)"
          --licence "CC0 / CC-BY 4.0" --source https://www.gbif.org --updated "$(date -u +%F)" --out dist-gbif
      - uses: actions/upload-artifact@v4
        with:
          name: gbif-dataset
          path: |
            dist-gbif/data-gbif_fr_recent*.js
            dist-gbif/datasets.js
